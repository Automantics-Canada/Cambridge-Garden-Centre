services:
  postgres:
    image: postgres:17-alpine
    container_name: cgc-qa-postgres
    environment:
      POSTGRES_DB: cgc_integration
      POSTGRES_USER: cgctest
      POSTGRES_PASSWORD: cgctest
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cgctest -d cgc_integration"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
