name: Keep Backend Alive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # This pinged cambridge-garden-centre-2.onrender.com, which is not the
      # backend the app talks to — the frontend's VITE_API_URL points at the
      # Railway service. The warm-up was therefore keeping an unused host alive
      # while the real one paid a cold start on the first request of the day.
      - name: Ping Backend
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://cambridge-garden-centre-production-0f60.up.railway.app' }}
        run: |
          curl -sS --max-time 90 "$BACKEND_URL/api/health"
          echo "Backend pinged at $(date)"
